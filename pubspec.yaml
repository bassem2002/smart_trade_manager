name: smart_trade_manager

description: "Flutter mobile application for trade and logistics management with Firebase real-time synchronization and Google ML Kit."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  # Firebase
  firebase_core: ^3.13.0
  firebase_auth: ^5.1.0
  firebase_database: ^11.0.4

  # Local storage
  shared_preferences: ^2.2.3

  # Google ML Kit
  google_mlkit_text_recognition: ^0.14.0
  google_mlkit_barcode_scanning: ^0.13.0
  google_mlkit_language_id: ^0.10.0
  google_mlkit_translation: ^0.12.0

  # Device features
  image_picker: ^1.1.2
  flutter_local_notifications: ^17.2.2
  vibration: ^2.0.1

  # UI
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true